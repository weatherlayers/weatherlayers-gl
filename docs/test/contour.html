<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src weatherlayers.com *.weatherlayers.com *.weatherlayers.workers.dev localhost:* unpkg.com cdn.jsdelivr.net *.mapbox.com *.googleapis.com *.gstatic.com *.arcgis.com web3dsurvey.com blob: 'unsafe-inline' 'unsafe-eval';
    style-src weatherlayers.com *.weatherlayers.com *.weatherlayers.workers.dev localhost:* unpkg.com *.mapbox.com *.googleapis.com *.gstatic.com *.arcgis.com 'unsafe-inline';
    img-src weatherlayers.com *.weatherlayers.com *.weatherlayers.workers.dev localhost:* catalog.weatherlayers.com *.basemaps.cartocdn.com *.googleapis.com *.gstatic.com *.arcgis.com data: blob:;
    connect-src weatherlayers.com *.weatherlayers.com *.weatherlayers.workers.dev localhost:* catalog.weatherlayers.com *.basemaps.cartocdn.com *.mapbox.com *.googleapis.com *.gstatic.com *.arcgis.com web3dsurvey.com data: ws:;
    font-src *.gstatic.com *.arcgis.com
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeatherLayers</title>
  <link href="https://weatherlayers.com/assets/logo.png" rel="icon" type="image/png">
  <script src="https://unpkg.com/stats.js@0.17.0/build/stats.min.js"></script>
  <script src="https://unpkg.com/deck.gl@9.4.0/dist/dist.dev.js"></script>
  <script src="https://unpkg.com/geotiff@3.0.5/dist-browser/geotiff.js"></script>
  <script src="../../dist/weatherlayers-deck.umd.min.js"></script>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../info-control.css">
  <link rel="stylesheet" href="../fps-control.css">
  <script defer data-domain="demo.weatherlayers.com" data-api="/phq/api/event" src="/phq/js/script.js"></script>
  <script defer src="https://web3dsurvey.com/collector.js"></script>
</head>

<body>
  <div id="container">
    <div id="deck"></div>
  </div>
  <div id="top-left"></div>
  <div id="bottom-left"></div>
  <div id="bottom-right"></div>

  <script type="module">
    import { WEATHER_LAYERS_ACCESS_TOKEN } from '../auth.js';
    import { initConfig, initGui, cssToColor } from '../config.js';
    import { BASEMAP_RASTER_STYLE_URL, BASEMAP_ATTRIBUTION } from '../basemap.js';
    import { InfoControl } from '../info-control.js';
    import { FpsControl } from '../fps-control.js';

    window.addEventListener('DOMContentLoaded', async () => {
      const config = await initConfig({ deckgl: true, webgl2: true });

      // deck.gl
      const deckgl = window.deckgl = new deck.Deck({
        parent: document.getElementById('deck'),
        initialViewState: {
          longitude: 30,
          latitude: 0,
          zoom: 0,
        },
        controller: {
          normalize: false,
        },
        views: [
          new deck.MapView({ repeat: true }),
        ],
        layers: [],
      });

      // info panels
      const infoControl = new InfoControl();
      infoControl.prependTo(document.getElementById('top-left'));
      deckgl.setProps({
        onViewStateChange: ({ viewState }) => infoControl.update(viewState),
      });

      // logo
      const logoControl = new WeatherLayers.LogoControl();
      logoControl.prependTo(document.getElementById('bottom-left'));

      // attribution
      const basemapAttributionControl = new WeatherLayers.AttributionControl({ attribution: BASEMAP_ATTRIBUTION });
      basemapAttributionControl.prependTo(document.getElementById('bottom-right'));

      // FPS meter
      const fpsControl = new FpsControl();
      fpsControl.prependTo(document.getElementById('bottom-right'));

      // config
      async function update(gui, forceUpdate) {
        const image = await WeatherLayers.loadTextureData('contour.png');
        const imageType = WeatherLayers.ImageType.SCALAR;
        const imageUnscale = [-40, 40];
        const bounds = [120, -15, 260.75, 79];

        deckgl.setProps({
          layers: [
            // new deck.TileLayer({
            //   id: 'basemap',
            //   data: BASEMAP_RASTER_STYLE_URL,
            //   minZoom: 0,
            //   maxZoom: 22,
            //   tileSize: 256,
            //   renderSubLayers: props => {
            //     const {bbox: {west, south, east, north}} = props.tile;
            //     return new deck.BitmapLayer(props, {
            //       data: null,
            //       image: props.data,
            //       bounds: [west, south, east, north],
            //     });
            //   },
            // }),
            new WeatherLayers.ContourLayer({
              id: 'contour',
              // data properties
              image,
              imageSmoothing: config.imageSmoothing,
              imageInterpolation: config.imageInterpolation,
              imageType,
              imageUnscale,
              imageMinValue: config.imageMinValue > 0 ? config.imageMinValue : null,
              imageMaxValue: config.imageMaxValue > 0 ? config.imageMaxValue : null,
              bounds,
              // style properties
              visible: true,
              interval: config.contour.interval,
              majorInterval: config.contour.majorInterval,
              width: config.contour.width,
              color: cssToColor(config.contour.color),
              palette: config.contour.palette ? palette : null,
              labelSpacing: config.contour.labelSpacing,
              textFontFamily: config.contour.textFontFamily,
              textSize: config.contour.textSize,
              textColor: cssToColor(config.contour.textColor),
              textOutlineWidth: config.contour.textOutlineWidth,
              textOutlineColor: cssToColor(config.contour.textOutlineColor),
              opacity: config.contour.opacity,
            }),
          ],
        });
      }
      const gui = initGui(config, update, { deckgl, webgl2: true });
      await update(gui, true);
    });
  </script>
</body>

</html>
